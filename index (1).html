<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBOM Integrity Tracker</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 560px;
    }
    h1 {
      font-size: 22px;
      color: #7c73e6;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 30px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #7c73e6; }
    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-connect { background: #2a2a4a; color: #7c73e6; margin-bottom: 8px; }
    .btn-register { background: #3a3a6a; color: #fff; }
    .btn-verify { background: #7c73e6; color: #fff; }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .verified { background: #1a3a2a; color: #4caf50; border: 1px solid #4caf50; }
    .tampered { background: #3a1a1a; color: #f44336; border: 1px solid #f44336; }
    .info { background: #1a2a3a; color: #64b5f6; border: 1px solid #64b5f6; }
    .wallet {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-top: 8px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 13px;
    }
    .tab.active { background: #7c73e6; color: #fff; border-color: #7c73e6; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>SBOM Integrity Tracker</h1>
  <p class="subtitle">Tamper-proof software component verification on Ethereum</p>

  <button class="btn btn-connect" onclick="connectWallet()">Connect MetaMask</button>
  <div class="wallet" id="wallet-status">Not connected</div>

  <div class="tabs" style="margin-top: 24px;">
    <button class="tab active" onclick="switchTab('register')">Register</button>
    <button class="tab" onclick="switchTab('verify')">Verify</button>
  </div>

  <!-- Register Panel -->
  <div class="panel active" id="panel-register">
    <label>Component Name</label>
    <input id="reg-name" placeholder="e.g. react" />
    <label>Version</label>
    <input id="reg-version" placeholder="e.g. 18.0.0" />
    <label>SHA256 Hash (bytes32)</label>
    <input id="reg-hash" placeholder="0x..." />
    <button class="btn btn-register" onclick="registerComponent()">Register on Blockchain</button>
  </div>

  <!-- Verify Panel -->
  <div class="panel" id="panel-verify">
    <label>Component Name</label>
    <input id="ver-name" placeholder="e.g. react" />
    <label>Version</label>
    <input id="ver-version" placeholder="e.g. 18.0.0" />
    <label>SHA256 Hash to Verify (bytes32)</label>
    <input id="ver-hash" placeholder="0x..." />
    <button class="btn btn-verify" onclick="verifyComponent()">Verify Integrity</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
  const CONTRACT_ADDRESS = "0x9B5A0D5d0C81A584653866cDa0A91ECCdB551fDd";
  const ABI = [
    "function registerComponent(string _name, string _version, bytes32 _hash) public",
    "function verifyComponent(string _name, string _version, bytes32 _hashToCheck) public returns (string memory)"
  ];

  let provider, signer, contract;

  async function connectWallet() {
    if (!window.ethereum) {
      showResult("MetaMask not found. Please install it.", "info");
      return;
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
    const addr = await signer.getAddress();
    document.getElementById("wallet-status").textContent =
      "Connected: " + addr.slice(0, 6) + "..." + addr.slice(-4);
    showResult("Wallet connected. You are on Sepolia testnet.", "info");
  }

  async function registerComponent() {
    if (!contract) { showResult("Connect wallet first.", "info"); return; }
    const name = document.getElementById("reg-name").value.trim();
    const version = document.getElementById("reg-version").value.trim();
    const hash = document.getElementById("reg-hash").value.trim();
    if (!name || !version || !hash) {
      showResult("Please fill all fields.", "info"); return;
    }
    try {
      showResult("Registering on blockchain...", "info");
      const tx = await contract.registerComponent(name, version, hash);
      await tx.wait();
      showResult("Component registered successfully on Ethereum Sepolia.", "verified");
    } catch (e) {
      showResult("Error: " + (e.reason || e.message), "tampered");
    }
  }

  async function verifyComponent() {
    if (!contract) { showResult("Connect wallet first.", "info"); return; }
    const name = document.getElementById("ver-name").value.trim();
    const version = document.getElementById("ver-version").value.trim();
    const hash = document.getElementById("ver-hash").value.trim();
    if (!name || !version || !hash) {
      showResult("Please fill all fields.", "info"); return;
    }
    try {
      showResult("Verifying on blockchain...", "info");
      const result = await contract.verifyComponent.staticCall(name, version, hash);
      if (result.includes("VERIFIED")) {
        showResult("✓ " + result, "verified");
      } else {
        showResult("✗ " + result, "tampered");
      }
    } catch (e) {
      showResult("Error: " + (e.reason || e.message), "tampered");
    }
  }

  function switchTab(tab) {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    event.target.classList.add("active");
    document.getElementById("panel-" + tab).classList.add("active");
    document.getElementById("result").style.display = "none";
  }

  function showResult(msg, type) {
    const el = document.getElementById("result");
    el.textContent = msg;
    el.className = "result " + type;
    el.style.display = "block";
  }
</script>
</body>
</html>
